[build]
  command = "npm ci && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# The app's service worker must always be re-checked so updates reach people quickly
[[headers]]
  for = "/finance-tracker/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/finance-tracker/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
